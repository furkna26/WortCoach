name = "wortcoach-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"
account_id = "e730a32bd6fde1b129f33d41b72267e1"

[vars]
ALLOWED_ORIGIN = "https://furkna26.github.io,http://localhost:8000,http://127.0.0.1:5500,http://localhost:3000"
GEMINI_MODEL = "gemini-3.1-flash-lite"
DAILY_PER_IP = "40"
DAILY_GLOBAL = "800"

[[kv_namespaces]]
binding = "LIMITS"
id = "d1a04931edd44affb8dee3a945539c99"

[[ratelimits]]
name = "MINUTE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Supabase Veritabanını 7 Gün Hareketsizlikten Korumak İçin Otomatik Cron Tetikleyici (Her 12 Saatte Bir)
[triggers]
crons = ["0 4,16 * * *"]
