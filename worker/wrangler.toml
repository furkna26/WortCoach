name = "wortcoach-proxy"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://furkna26.github.io,http://localhost:8000,http://127.0.0.1:5500,http://localhost:3000"
GEMINI_MODEL = "gemini-3.1-flash-lite"
DAILY_PER_IP = "40"
DAILY_GLOBAL = "800"

[[kv_namespaces]]
binding = "LIMITS"
id = "2335363350024e0f856d8e72e7a7318b"

[[ratelimits]]
name = "MINUTE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
