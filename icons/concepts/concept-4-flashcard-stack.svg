<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlue4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgBlue4)"/>

  <!-- 3D Flashcard Katmanları (Aralıklı Tekrar / Deste) -->
  <g transform="translate(256, 210)">
    <!-- 3. Arka Kart (En arkadaki deste kartı) -->
    <rect x="-140" y="-120" width="280" height="170" rx="20" fill="#93C5FD" fill-opacity="0.35" transform="rotate(-10)"/>
    <!-- 2. Orta Kart -->
    <rect x="-140" y="-115" width="280" height="170" rx="20" fill="#DBEAFE" fill-opacity="0.65" transform="rotate(-4)"/>
    <!-- 1. Ön Kart (Saf Beyaz, Vurgulu) -->
    <rect x="-140" y="-100" width="280" height="176" rx="22" fill="#FFFFFF"/>

    <!-- Kart İçi Çizgiler & Simge -->
    <!-- Dil Rozeti -->
    <rect x="-115" y="-76" width="46" height="24" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="-92" y="-60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#2563EB">DE</text>
    
    <!-- Kelime Çizgisi -->
    <rect x="-55" y="-74" width="165" height="20" rx="6" fill="#1E293B"/>
    
    <!-- Çeviri Çizgileri -->
    <rect x="-115" y="-30" width="225" height="10" rx="4" fill="#94A3B8" fill-opacity="0.4"/>
    <rect x="-115" y="-10" width="170" height="10" rx="4" fill="#94A3B8" fill-opacity="0.3"/>

    <!-- Koçluk Tik / Yıldız İmzası (Öğrenildi / Usta) -->
    <circle cx="95" cy="35" r="26" fill="#2563EB"/>
    <path d="M84 35 L92 43 L108 27" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tipografi -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="1">
    Wort<tspan fill="#93C5FD">Coach</tspan>
  </text>
</svg>
