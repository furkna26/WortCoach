<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Koyu Zemin Üzerinde Mavi-Beyaz Kontrast -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad2)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="3"/>

  <!-- Açık Kitap + Konuşma Balonu (Dil Koçu & Diyalog) -->
  <g transform="translate(256, 230)">
    <!-- Kitap Sol Sayfası (Beyaz) -->
    <path d="M-130 30 C-90 10 -40 20 -6 45 L-6 -85 C-40 -110 -90 -120 -130 -100 Z" fill="#FFFFFF"/>
    <!-- Kitap Sağ Sayfası (Açık Mavi Gradyan) -->
    <path d="M130 30 C90 10 40 20 6 45 L6 -85 C40 -110 90 -120 130 -100 Z" fill="url(#blueGlow)"/>
    
    <!-- Sayfa Çizgileri / Doku -->
    <line x1="-105" y1="-55" x2="-35" y2="-40" stroke="#0F172A" stroke-width="6" stroke-linecap="round" opacity="0.15"/>
    <line x1="-105" y1="-25" x2="-45" y2="-12" stroke="#0F172A" stroke-width="6" stroke-linecap="round" opacity="0.15"/>
    <line x1="35" y1="-40" x2="105" y2="-55" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <line x1="45" y1="-12" x2="105" y2="-25" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

    <!-- Ortadan Yükselen Konuşma Kuyruğu (Koçluk / Diyalog) -->
    <path d="M-15 42 L0 80 L15 42 Z" fill="#60A5FA"/>

    <!-- Üst Vurgu: Leitner Kart Sembolü -->
    <rect x="-24" y="-140" width="48" height="34" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="4"/>
    <line x1="-12" y1="-123" x2="12" y2="-123" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Tipografi -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" letter-spacing="2">
    Wort<tspan fill="#3B82F6">Coach</tspan>
  </text>
  <text x="256" y="448" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#94A3B8" letter-spacing="4">
    SPRACHINSTITUT
  </text>
</svg>
