<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="crestGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Kalkan Dış Işıltı / Kenarlık -->
  <g filter="url(#shieldShadow)">
    <path d="M256 36 C382 36 442 74 442 162 C442 322 334 430 256 466 C178 430 70 322 70 162 C70 74 130 36 256 36 Z" 
          fill="url(#shieldGrad)" 
          stroke="#93C5FD" 
          stroke-width="5" 
          stroke-opacity="0.45"/>
    
    <!-- İç Kalkan Hattı (Academic Inset Line) -->
    <path d="M256 54 C364 54 420 86 420 164 C420 306 322 404 256 440 C190 404 92 306 92 164 C92 86 148 54 256 54 Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="2.5" 
          stroke-opacity="0.35" 
          stroke-dasharray="8 4"/>

    <!-- Leitner Başarı Yıldızları / Taç (3 Seviye) -->
    <circle cx="212" cy="106" r="11" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="256" cy="90" r="15" fill="#FFFFFF"/>
    <circle cx="300" cy="106" r="11" fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Kalkan İçi Monogram: Geometrik Akıllı 'W' -->
    <path d="M166 160 L203 296 L234 195 L278 195 L309 296 L346 160 L386 160 L335 342 L288 342 L256 238 L224 342 L177 342 L126 160 Z" 
          fill="#FFFFFF" 
          filter="drop-shadow(0 3px 4px rgba(15,23,42,0.3))"/>
  </g>
</svg>
